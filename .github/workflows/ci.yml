name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # engines declares >=22.13; 22.x and 24.x bracket what users actually run.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # Zod validates session-projection state in Host integration tests.
      # The runtime supplies peer dependencies; do not install the whole Harness.
      - run: npm install --ignore-scripts --legacy-peer-deps --no-package-lock
      - run: npm test
